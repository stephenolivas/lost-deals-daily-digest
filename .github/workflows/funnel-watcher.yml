name: Funnel Change Watcher

on:
  schedule:
    # Every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Slack DMs sent; still logs what would be sent)'
        type: boolean
        default: false
      lookback_minutes:
        description: 'Override lookback window (default 18)'
        type: string
        default: '18'

# Prevent overlapping runs — a slow run shouldn't collide with the next tick.
concurrency:
  group: funnel-change-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOSE_API_KEY:    ${{ secrets.CLOSE_API_KEY }}
      SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
      DRY_RUN:          ${{ inputs.dry_run || 'false' }}
      LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '18' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        run: python3 -u funnel_watcher.py
